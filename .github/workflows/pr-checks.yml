name: PR Checks

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ master ]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      main-code-changed: ${{ steps.changes.outputs.main-code }}
      main-any-changed: ${{ steps.changes.outputs.main-any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # paths-filter ORs the patterns in a filter, so a negated pattern such as '!docs/**' matches every
          # file outside docs/ and would flag workflow-only PRs. 'Pixelbadger.Toolkit/**' already excludes the
          # Tests, Benchmarks, docs and .github trees.
          filters: |
            main-code:
              - 'Pixelbadger.Toolkit/**'
            main-any:
              - 'Pixelbadger.Toolkit/**'
              - 'Pixelbadger.Toolkit.Tests/**'

  mechanical-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        id: version-bump
        run: |
          FAILED=false

          PROD_CHANGES=$(git diff origin/master...HEAD --name-only | grep -E '\.(cs|csproj)$' | grep -vE '^Pixelbadger\.Toolkit\.(Tests|Benchmarks)/' || true)

          if [ -n "$PROD_CHANGES" ]; then
            CSPROJ_IN_DIFF=$(git diff origin/master...HEAD --name-only | grep 'Pixelbadger\.Toolkit/Pixelbadger\.Toolkit\.csproj' || true)
            if [ -z "$CSPROJ_IN_DIFF" ]; then
              echo "::error::Version bump required: production .cs/.csproj files changed but Pixelbadger.Toolkit.csproj is not in the diff."
              FAILED=true
            else
              BRANCH_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj)
              MASTER_VERSION=$(git show origin/master:Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj | grep -oP '(?<=<Version>)[^<]+')
              HIGHER=$(printf '%s\n%s\n' "$MASTER_VERSION" "$BRANCH_VERSION" | sort -V | tail -1)
              if [ "$HIGHER" = "$MASTER_VERSION" ] || [ "$BRANCH_VERSION" = "$MASTER_VERSION" ]; then
                echo "::error::Version bump required: branch version ($BRANCH_VERSION) is not strictly higher than master ($MASTER_VERSION)."
                FAILED=true
              else
                echo "Version bump OK: $MASTER_VERSION -> $BRANCH_VERSION"
              fi
            fi
          else
            echo "No production code changes — version bump not required."
          fi

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Check tests present
        id: tests-present
        run: |
          FAILED=false

          NEW_IMPL=$(git diff origin/master...HEAD --diff-filter=A --name-only | grep -E '^Pixelbadger\.Toolkit/(Components|Commands)/[^/]+\.cs$' || true)

          for FILE in $NEW_IMPL; do
            BASENAME=$(basename "$FILE" .cs)
            EXPECTED="${BASENAME}Tests.cs"
            MATCH=$(find Pixelbadger.Toolkit.Tests -name "$EXPECTED" 2>/dev/null || true)
            if [ -z "$MATCH" ]; then
              echo "::error::Missing test file: no $EXPECTED found under Pixelbadger.Toolkit.Tests/ for new file $FILE."
              FAILED=true
            else
              echo "Test coverage OK: $EXPECTED exists for $FILE"
            fi
          done

          if [ -z "$NEW_IMPL" ]; then
            echo "No new Components/ or Commands/ files — test presence check skipped."
          fi

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Check benchmarks updated
        id: benchmarks-updated
        run: |
          FAILED=false

          WATCHLIST=(
            "LevenshteinCalculator"
            "BrainfuckInterpreter"
            "OokInterpreter"
            "AbjadifyComponent"
            "ImageSteganography"
            "HomomorphicEncryptionComponent"
          )

          CHANGED_BASENAMES=$(git diff origin/master...HEAD --name-only | xargs -I{} basename {} .cs)

          for ENTRY in "${WATCHLIST[@]}"; do
            if echo "$CHANGED_BASENAMES" | grep -qx "$ENTRY"; then
              BENCHMARK_REFS=$(git diff origin/master...HEAD --name-only | grep -E '^Pixelbadger\.Toolkit\.Benchmarks/' || true)
              FOUND=false
              for BF in $BENCHMARK_REFS; do
                if grep -q "$ENTRY" "$BF" 2>/dev/null; then
                  FOUND=true
                  break
                fi
              done
              if [ "$FOUND" = false ]; then
                echo "::error::Benchmark update required: $ENTRY was changed but no benchmark file under Pixelbadger.Toolkit.Benchmarks/ referencing it appears in the diff."
                FAILED=true
              else
                echo "Benchmark OK: $ENTRY has a corresponding benchmark update."
              fi
            fi
          done

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Fail if any check failed
        if: steps.version-bump.outputs.failed == 'true' || steps.tests-present.outputs.failed == 'true' || steps.benchmarks-updated.outputs.failed == 'true'
        run: |
          echo "One or more mechanical checks failed. See ::error:: annotations above."
          exit 1

  check-version:
    runs-on: ubuntu-latest
    needs: [check-changes]
    if: needs.check-changes.outputs.main-code-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check version increment
        shell: pwsh
        run: |
          ./.github/scripts/check-version-increment.ps1 -ProjectFile "Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj" -PackageId "Pixelbadger.Toolkit"

  build-and-test:
    runs-on: ubuntu-latest
    needs: [check-changes, check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack (validation only)
        run: dotnet pack --no-build --configuration Release --output ./artifacts

  # Review → fix → review loop
  #
  # The reviewer and the fixer both run as the Claude GitHub App, which also authored most PRs.
  # GitHub won't let an author approve or request changes on their own PR, so the reviewer only
  # writes a verdict file. A plain step then submits the formal review as github-actions[bot].
  # Reviews made with GITHUB_TOKEN don't fire workflow events, so the fixer and the merge run as
  # jobs in this workflow rather than in response to a review event. A fixer push fires
  # `synchronize`, which re-runs this workflow, so the loop continues until approval or the
  # round limit.
  claude-review:
    runs-on: ubuntu-latest
    needs: [mechanical-checks, build-and-test]
    if: always() && needs.mechanical-checks.result != 'cancelled' && needs.build-and-test.result != 'cancelled'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    outputs:
      verdict: ${{ steps.submit.outputs.verdict }}
      rounds: ${{ steps.review-type.outputs.rounds }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect review type
        id: review-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REVIEWS=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews?per_page=100")
          PRIOR=$(echo "$REVIEWS" | jq '[.[] | select(.state != "PENDING")] | length')
          ROUNDS=$(echo "$REVIEWS" | jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED")] | length')
          echo "rounds=$ROUNDS" >> "$GITHUB_OUTPUT"
          if [ "$PRIOR" -gt 0 ]; then
            echo "type=followup" >> "$GITHUB_OUTPUT"
          else
            echo "type=primary" >> "$GITHUB_OUTPUT"
          fi

      # Fetch failing-job logs here so neither agent has to dig for them.
      - name: Collect CI results
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MECHANICAL: ${{ needs.mechanical-checks.result }}
          BUILD: ${{ needs.build-and-test.result }}
        run: |
          mkdir -p .ci-review
          OUT=.ci-review/ci-failures.md
          : > "$OUT"
          FAILED=false
          [ "$MECHANICAL" = "failure" ] && FAILED=true
          [ "$BUILD" = "failure" ] && FAILED=true
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" = true ]; then
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r JOB_ID JOB_NAME; do
              {
                echo "## Failed job: $JOB_NAME"
                echo '```'
                # --log-failed prints only the failed steps as "job<TAB>step<TAB>line".
                gh run view --job "$JOB_ID" --log-failed --repo "${{ github.repository }}" \
                  | cut -f3- | sed -E 's/^[0-9T:.-]+Z //' | grep -vE '^\s*Passed ' | tail -200 \
                  || echo "(could not fetch logs for job $JOB_ID)"
                echo '```'
                echo
              } >> "$OUT"
            done
            echo "CI failures collected:"
            cat "$OUT"
          fi

      - name: Primary review (full diff)
        if: steps.review-type.outputs.type == 'primary'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} thoroughly. Read the full diff with `gh pr diff ${{ github.event.pull_request.number }}`. Be concise. Flag issues only; don't praise.

            FIRST, check CI. Mechanical checks: ${{ needs.mechanical-checks.result }}. Build and test: ${{ needs.build-and-test.result }}.
            If either failed, read `.ci-review/ci-failures.md` (failing-job logs). A failing check blocks approval. Identify the root cause from the log and say exactly what is failing and why, so the implementor can fix it.

            Then evaluate the diff across all five dimensions:

            **Correctness**: logic errors, off-by-ones, wrong conditionals, unhandled edge cases, unhandled nulls in critical paths.
            **Test quality**: coverage gaps (success paths, error conditions, edge cases), weak assertions, missing error-path tests.
            **Architecture**: component-per-command violations, SRP violations, shared logic that should be a service with an interface.
            **Security**: prompt injection, path traversal, other OWASP top-10 risks.
            **Consistency**: naming/style inconsistencies, docs or examples that don't match the implementation, CLAUDE.md patterns violated.

            Where an issue is tied to a specific line, post an inline comment using:
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` with `commit_id` (`${{ github.event.pull_request.head.sha }}`), `path`, `line`, and `body`.

            MANDATORY FINAL STEP: write your verdict with the Write tool to `${{ github.workspace }}/.ci-review/verdict.md`.
            - Line 1 must be exactly `APPROVE` or `REQUEST_CHANGES`.
            - The remaining lines are the review body: a numbered list of every issue the implementor must fix, or `LGTM.` when approving.
            Do NOT run `gh pr review`. A later step submits your verdict as the formal review.

          claude_args: '--model claude-sonnet-5-5 --max-turns 30 --allowed-tools "Read,Write,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh api:*)"'

      - name: Follow-up review (changes since last review)
        if: steps.review-type.outputs.type == 'followup'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          prompt: |
            This is a follow-up review of PR #${{ github.event.pull_request.number }} after the implementor pushed changes.

            FIRST, check CI. Mechanical checks: ${{ needs.mechanical-checks.result }}. Build and test: ${{ needs.build-and-test.result }}.
            If either failed, read `.ci-review/ci-failures.md` (failing-job logs). A failing check blocks approval. Identify the root cause from the log and say exactly what is failing and why.

            Then:
            1. Read the prior reviews and comments: `gh pr view ${{ github.event.pull_request.number }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            2. Read the commits since the last review (`gh pr view ${{ github.event.pull_request.number }} --json commits`) and the current diff (`gh pr diff ${{ github.event.pull_request.number }}`).
            3. Check whether every issue raised in prior reviews has been properly addressed, and whether the fixes introduced new bugs or regressions.

            Don't re-review code that was already accepted. Be brief.

            MANDATORY FINAL STEP: write your verdict with the Write tool to `${{ github.workspace }}/.ci-review/verdict.md`.
            - Line 1 must be exactly `APPROVE` or `REQUEST_CHANGES`.
            - The remaining lines are the review body: a numbered list of every issue still outstanding, or `LGTM.` when approving.
            Do NOT run `gh pr review`. A later step submits your verdict as the formal review.

          claude_args: '--model claude-sonnet-5-5 --max-turns 20 --allowed-tools "Read,Write,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh api:*)"'

      - name: Submit review
        id: submit
        if: always() && steps.review-type.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CI_FAILED: ${{ steps.ci.outputs.failed }}
        run: |
          FILE=.ci-review/verdict.md
          VERDICT=""
          BODY=""
          if [ -f "$FILE" ]; then
            VERDICT=$(head -1 "$FILE" | tr -d '[:space:]')
            BODY=$(tail -n +2 "$FILE")
          fi

          if [ "$VERDICT" != "APPROVE" ] && [ "$VERDICT" != "REQUEST_CHANGES" ]; then
            if [ "$CI_FAILED" = "true" ]; then
              # The reviewer didn't produce a verdict, but red CI alone is enough to send the PR back.
              VERDICT=REQUEST_CHANGES
              BODY=$(printf 'CI is failing. Fix the failing checks below.\n\n%s' "$(cat .ci-review/ci-failures.md)")
            else
              echo "::error::Reviewer did not write a valid verdict to $FILE."
              exit 1
            fi
          fi

          # Never approve over red CI, whatever the reviewer concluded.
          if [ "$VERDICT" = "APPROVE" ] && [ "$CI_FAILED" = "true" ]; then
            VERDICT=REQUEST_CHANGES
            BODY=$(printf '%s\n\nCI is failing, so this cannot be approved:\n\n%s' "$BODY" "$(cat .ci-review/ci-failures.md)")
          fi

          [ -n "$BODY" ] || BODY="LGTM."
          printf '%s\n\n---\n_Automated review of %s_\n' "$BODY" "${{ github.event.pull_request.head.sha }}" > .ci-review/body.md

          if [ "$VERDICT" = "APPROVE" ]; then
            if ! gh pr review "$PR" --approve --body-file .ci-review/body.md; then
              echo "::error::Could not approve as github-actions[bot]. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings → Actions → General."
              gh pr comment "$PR" --body-file .ci-review/body.md || true
              exit 1
            fi
          else
            gh pr review "$PR" --request-changes --body-file .ci-review/body.md
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

  claude-fix:
    runs-on: ubuntu-latest
    needs: [claude-review]
    if: |
      always() && needs.claude-review.outputs.verdict == 'REQUEST_CHANGES' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      MAX_ROUNDS: 6

    steps:
      - name: Check round limit
        id: limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ROUNDS: ${{ needs.claude-review.outputs.rounds }}
        run: |
          # ROUNDS counts change requests made before this run's review.
          if [ "$((ROUNDS + 1))" -ge "$MAX_ROUNDS" ]; then
            echo "Reached $MAX_ROUNDS review rounds; handing over to a human."
            gh pr comment ${{ github.event.pull_request.number }} --body "$(printf 'The automated review loop has requested changes %s times without reaching approval, so it has stopped. A human needs to take a look.\n\n---\n_Generated by the PR Checks workflow_' "$MAX_ROUNDS")"
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.limit.outputs.stop != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET
        if: steps.limit.outputs.stop != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Claude Code Agent (review → iteration)
        if: steps.limit.outputs.stop != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          prompt: |
            The reviewer requested changes on PR #${{ github.event.pull_request.number }}. You are the implementor; fix everything it raised.

            1. Read the latest review and all earlier feedback: `gh pr view ${{ github.event.pull_request.number }} --comments`
               and the inline comments: `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            2. If CI failed, the review includes the failing logs. Reproduce the failure locally (`dotnet build -c Release && dotnet test --no-build -c Release`) before fixing it. Fix the root cause. Never skip, disable, or delete a test to get green.
            3. Read the diff for context: `gh pr diff ${{ github.event.pull_request.number }}`
            4. Address every outstanding issue: code, tests, or documentation.
            5. Verify: `dotnet build -c Release && dotnet test --no-build -c Release`. Everything must pass.
            6. Commit with a clear message describing what was fixed.
            7. Push exactly once, at the very end: `git push`. Each push restarts the review workflow, so don't push intermediate work.

            If you disagree with a review point, or a point can't be fixed in this PR, don't ignore it. Explain why in a PR comment (`gh pr comment`) so the next review round sees your reasoning.
            Do not open a new PR. Push to the existing branch only. Follow all instructions in CLAUDE.md.
          claude_args: '--model claude-sonnet-5-5 --max-turns 60 --permission-mode auto'

  auto-merge:
    runs-on: ubuntu-latest
    needs: [check-changes, mechanical-checks, build-and-test, claude-review]
    if: |
      needs.claude-review.outputs.verdict == 'APPROVE' &&
      needs.mechanical-checks.result == 'success' && needs.build-and-test.result == 'success' &&
      startsWith(github.head_ref, 'feature/')
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAIN_CODE_CHANGED: ${{ needs.check-changes.outputs.main-code-changed }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # A human may have requested changes since; their block wins.
          DECISION=$(gh pr view "$PR" --json reviewDecision --jq '.reviewDecision')
          if [ "$DECISION" = "CHANGES_REQUESTED" ]; then
            echo "A reviewer still has changes requested. Not merging."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "${{ github.event.pull_request.head.sha }}"

          # A merge made with GITHUB_TOKEN doesn't fire push or pull_request events, so the post-merge
          # workflows never start on their own. workflow_dispatch is exempt from that rule. The publish
          # run then waits for a human to approve it in the nuget-publish environment.
          gh workflow run project-automation.yml --ref master -f pr_number="$PR"
          if [ "$MAIN_CODE_CHANGED" = "true" ]; then
            gh workflow run publish-to-nuget.yml --ref master
          fi
