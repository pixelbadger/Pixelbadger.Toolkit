name: Project Automation

on:
  pull_request:
    types: [closed]
    branches: [master]
  # The PR Checks auto-merge job merges with GITHUB_TOKEN, which doesn't fire pull_request events,
  # so it dispatches this workflow with the merged PR's number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the merged PR whose linked issues should be closed
        required: true

jobs:
  close-linked-issues:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Label and close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ -z "$(gh pr view "$PR_NUMBER" --json mergedAt --jq '.mergedAt // empty')" ]; then
            echo "::error::PR #$PR_NUMBER is not merged."
            exit 1
          fi

          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj)
          RELEASE_LABEL="release/v${VERSION}"

          gh label create "$RELEASE_LABEL" \
            --color "#6f42c1" \
            --description "Released in v${VERSION}" \
            2>/dev/null || true

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q '.body')

          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiP '(?:closes|fixes|resolves)\s+#\K\d+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body."
            exit 0
          fi

          for ISSUE_NUM in $ISSUE_NUMBERS; do
            echo "Processing issue #${ISSUE_NUM}"
            gh issue edit "$ISSUE_NUM" \
              --add-label "$RELEASE_LABEL" \
              --add-label "status: done" \
              --remove-label "status: in-progress" \
              2>/dev/null || true
            gh issue close "$ISSUE_NUM" \
              --comment "Closed by PR #${PR_NUMBER}. Released in v${VERSION}." \
              2>/dev/null || true
          done
