name: Build, Pack, and Publish to NuGet

on:
  push:
    branches: [ master ]
    paths:
      - 'Pixelbadger.Toolkit/**'
      - '!**/*.Tests/**'
      - '!.github/**'
      - '!Pixelbadger.Toolkit.Benchmarks/**'
      - '!docs/**'
  # The PR Checks auto-merge job merges with GITHUB_TOKEN, whose pushes don't trigger workflows,
  # so it dispatches this workflow explicitly. Publishing waits for approval in the nuget-publish environment.
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      main-code-changed: ${{ steps.changes.outputs.main-code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          # Negated patterns are ORed by paths-filter, so they would match unrelated files.
          # 'Pixelbadger.Toolkit/**' already excludes the Tests, Benchmarks, docs and .github trees.
          main-code:
            - 'Pixelbadger.Toolkit/**'

  build-and-test:
    runs-on: ubuntu-latest
    needs: [check-changes]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
      continue-on-error: true  # Continue even if no tests exist

  publish-main:
    runs-on: ubuntu-latest
    needs: [check-changes, build-and-test]
    if: github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.main-code-changed == 'true'
    # Required reviewers on this environment gate every release on a human approval.
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write  # OIDC token for NuGet trusted publishing

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj

    - name: Build
      run: dotnet build Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj --no-restore --configuration Release

    - name: Pack
      run: dotnet pack Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj --no-build --configuration Release --output ./artifacts

    # Trusted publishing: exchanges this job's OIDC token for a short-lived API key. Needs a trusted
    # publishing policy on nuget.org for this repo, publish-to-nuget.yml and the nuget-publish environment.
    - name: NuGet login (trusted publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push ./artifacts/Pixelbadger.Toolkit.*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key "$NUGET_API_KEY" \
          --skip-duplicate

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' Pixelbadger.Toolkit/Pixelbadger.Toolkit.csproj)
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "v${VERSION}" || echo "Tag v${VERSION} already exists"
        git push origin "v${VERSION}" || echo "Tag v${VERSION} already pushed"
        gh release create "v${VERSION}" \
          --title "Release v${VERSION}" \
          --generate-notes \
          --latest \
          || echo "Release v${VERSION} already exists"
